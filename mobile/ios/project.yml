# XcodeGen: `brew install xcodegen && xcodegen generate` → MaltaPayslips.xcodeproj
name: MaltaPayslips
options:
  bundleIdPrefix: com.maltacalculator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: "0.57.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  MaltaPayslips:
    type: application
    platform: iOS
    sources:
      - MaltaPayslips
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maltacalculator.employee
        PRODUCT_NAME: Malta Payslips
        INFOPLIST_FILE: MaltaPayslips/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MaltaPayslips/Resources/MaltaPayslips.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Clerk
        product: Clerk
      - package: Firebase
        product: FirebaseMessaging
  MaltaPayslipsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MaltaPayslipsTests
    dependencies:
      - target: MaltaPayslips
