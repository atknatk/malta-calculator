name: iOS employee app

on:
  pull_request:
    paths:
      - "mobile/ios/**"
      - ".github/workflows/ios-employee.yml"
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"

concurrency:
  group: ios-employee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MaltaPayslips.xcodeproj \
            -scheme MaltaPayslips \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|Test Suite|Executed|BUILD|\*\*" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/ios/xcodebuild.log
