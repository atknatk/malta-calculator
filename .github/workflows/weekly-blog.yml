name: Weekly Blog Post Generation

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Specific blog topic (leave empty for auto-selection from topic list)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate blog post
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # Read the prompt template
          PROMPT=$(cat .github/prompts/weekly-blog.md)

          # If a specific topic was provided, append it
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            PROMPT="$PROMPT

          SPECIFIC TOPIC REQUESTED: ${{ github.event.inputs.topic }}"
          fi

          # Run Claude Code via Amazon Bedrock
          claude -p "$PROMPT" \
            --allowedTools "WebSearch,Write,Edit,Read,Glob,Grep,Bash(npm run build)" \
            --max-turns 50 \
            --verbose

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new blog post was generated"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New blog post detected"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          BRANCH="blog/weekly-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          # Commit changes
          git add -A
          git commit -m "$(cat <<'EOF'
          feat: Add weekly auto-generated blog post

          Auto-generated by Claude Code (Bedrock) via GitHub Actions.
          Review the content before merging.

          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
          EOF
          )"

          # Push and create PR
          git push origin "$BRANCH"

          gh pr create \
            --title "Weekly Blog Post - $(date +%Y-%m-%d)" \
            --body "$(cat <<'PREOF'
          ## Auto-Generated Blog Post

          This blog post was automatically generated by Claude Code via Amazon Bedrock.

          ### Review Checklist
          - [ ] Content accuracy - verify all Malta tax facts and figures
          - [ ] Sources cited are from official Malta government sites (CFR, SSC, gov.mt)
          - [ ] No duplicate content with existing blog posts
          - [ ] Links to calculators work correctly
          - [ ] SEO metadata is proper (title < 60 chars, description 150-160 chars)
          - [ ] Blog post added to listing page
          - [ ] Sitemap updated
          - [ ] Build passes

          > **Note:** Always review auto-generated content before merging.

          Generated with [Claude Code](https://claude.com/claude-code) via Amazon Bedrock
          PREOF
          )" \
            --base main \
            --label "blog,auto-generated"
