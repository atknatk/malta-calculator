name: Blog Post Generation (2x/week)

on:
  schedule:
    # Monday and Thursday at 09:00 UTC
    - cron: "0 9 * * 1,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "Specific blog topic (leave empty for auto-selection from topic list)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate-blog:
    if: false # Disabled
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate blog post
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          ANTHROPIC_MODEL: us.anthropic.claude-sonnet-4-5-20250929-v1:0
          ANTHROPIC_SMALL_FAST_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          # Read the prompt template
          PROMPT=$(cat .github/prompts/weekly-blog.md)

          # If a specific topic was provided, append it
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            PROMPT="$PROMPT

          SPECIFIC TOPIC REQUESTED: ${{ github.event.inputs.topic }}"
          fi

          # Run Claude Code via Amazon Bedrock
          claude -p "$PROMPT" \
            --model us.anthropic.claude-sonnet-4-5-20250929-v1:0 \
            --allowedTools "WebSearch,WebFetch,Write,Edit,Read,Glob,Grep,Bash(npm run build 2>&1 | tail -50)" \
            --max-turns 25 \
            --verbose

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new blog post was generated"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New blog post detected"
          fi

      - name: Commit and push to main
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "$(cat <<'EOF'
          feat: Add auto-generated blog post

          Auto-generated by Claude Code (Bedrock) via GitHub Actions.

          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
          EOF
          )"

          git push origin main
