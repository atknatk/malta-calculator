name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  schedule:
    # Nightly at 3 AM UTC — runs UI tests and performance tests
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer
  SCHEME: MaltaCalculator
  WORKSPACE: MaltaCalculator.xcworkspace
  DESTINATION: "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest"

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -switch "$DEVELOPER_DIR"
          else
            echo "Xcode 26 not available at $DEVELOPER_DIR, using runner default"
            xcode-select -p
          fi

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict --config Tools/.swiftlint.yml MaltaCalculator Tests

      - name: SwiftFormat
        run: swiftformat --lint --config Tools/.swiftformat MaltaCalculator Tests Packages

  build-test:
    name: Build & Test
    needs: lint
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -switch "$DEVELOPER_DIR"
          else
            echo "Xcode 26 not available at $DEVELOPER_DIR, using runner default"
            xcode-select -p
          fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ios-app/Packages/*/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test (Unit + Golden + Snapshot)
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Coverage report
        if: success()
        run: |
          if command -v xcrun &>/dev/null && [ -d TestResults.xcresult ]; then
            xcrun xccov view --report TestResults.xcresult || true
          fi

      - name: Check coverage thresholds
        if: success()
        run: |
          cd ..
          bash ios-app/scripts/check-coverage.sh ios-app/TestResults.xcresult || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios-app/TestResults.xcresult

      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: |
            ios-app/Packages/DesignSystem/Tests/DesignSystemTests/__Snapshots__
            ios-app/Packages/DesignSystem/Tests/DesignSystemTests/Snapshots

  golden-drift:
    name: Golden Drift Check
    runs-on: macos-15
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check golden fixture drift
        run: bash ios-app/scripts/golden-drift-check.sh

  test-ui:
    name: UI Tests (Nightly)
    runs-on: macos-15
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -switch "$DEVELOPER_DIR"
          else
            echo "Xcode 26 not available at $DEVELOPER_DIR, using runner default"
            xcode-select -p
          fi

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:MaltaCalculatorUITests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Run performance tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:CalculationKitTests/CalculationPerformanceTests \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
