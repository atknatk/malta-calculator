name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer
  SCHEME: MaltaCalculator
  WORKSPACE: MaltaCalculator.xcworkspace
  DESTINATION: "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest"

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -switch "$DEVELOPER_DIR"
          else
            echo "Xcode 26 not available at $DEVELOPER_DIR, using runner default"
            xcode-select -p
          fi

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: SwiftLint
        run: swiftlint lint --strict --config Tools/.swiftlint.yml MaltaCalculator Tests

      - name: SwiftFormat
        run: swiftformat --lint --config Tools/.swiftformat MaltaCalculator Tests Packages

  build-test:
    name: Build & Test
    needs: lint
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$DEVELOPER_DIR" ]; then
            sudo xcode-select -switch "$DEVELOPER_DIR"
          else
            echo "Xcode 26 not available at $DEVELOPER_DIR, using runner default"
            xcode-select -p
          fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ios-app/Packages/*/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Test (Unit)
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ios-app/TestResults.xcresult
