# SwiftLint Configuration — MaltaCalculator
# Tool version: 0.56.2 (pinned in Mintfile)
# Companion formatter: SwiftFormat 0.54.5
# Run `swiftlint rules` for full rule descriptions.

disabled_rules:
  - todo # WIP markers are acceptable during development
  - trailing_whitespace # Handled by SwiftFormat
  - opening_brace # SwiftFormat enforces brace style

opt_in_rules:
  - force_unwrapping
  - force_try
  - force_cast
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_optional_boolean
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - implicit_return
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_string_enum_value
  - single_test_class
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_closure_parameter
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

# Thresholds — Warning = fix soon, Error = CI blocks merge
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 300 # Generous for SwiftUI views with many computed properties
  error: 400

file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

function_body_length:
  warning: 40
  error: 60

cyclomatic_complexity:
  warning: 8
  error: 12

# Identifier naming — short names are OK for common SwiftUI patterns
identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id # SwiftUI Identifiable
    - vm # ViewModel shorthand
    - to # Common preposition parameter

# Force-pattern severity overrides — elevated to error so CI blocks any that slip through
force_unwrapping:
  severity: error

force_try:
  severity: error

force_cast:
  severity: error

excluded:
  - DerivedData
  - fastlane
  - Pods
  - .build
  - "**/.build"

# Reporter format — integrates with Xcode build log; CI also parses it
reporter: "xcode"
