# SwiftLint Configuration — MaltaCalculator
# Tool version: 0.56.2 (pinned in Mintfile)
# Companion formatter: SwiftFormat 0.54.5
# Run `swiftlint rules` for full rule descriptions.

disabled_rules:
  - todo # WIP markers (TODO/FIXME) are acceptable during development
  - trailing_whitespace # Handled by SwiftFormat — avoid duplicate enforcement
  - opening_brace # SwiftFormat enforces brace placement; avoid conflicting fixes

opt_in_rules:
  - force_unwrapping # No `!` unwraps — use guard/let or nil-coalescing (severity: error)
  - empty_count # Prefer `.isEmpty` over `.count == 0`
  - closure_spacing # Require spaces inside closure braces `{ stmt }`
  - contains_over_first_not_nil # `.contains(where:)` over `.first(where:) != nil`
  - convenience_type # Static-only types should be `enum` not `struct`
  - discouraged_optional_boolean # `Bool?` is error-prone — use enum or default
  - empty_string # Prefer `.isEmpty` over `== ""`
  - explicit_init # Avoid `.init()` when the type is clear
  - fatal_error_message # fatalError must include a descriptive message
  - first_where # `.first(where:)` over `.filter().first`
  - implicit_return # Single-expression closures/getters omit `return`
  - literal_expression_end_indentation # Align multiline literal closing bracket
  - multiline_parameters # One parameter per line when wrapping
  - operator_usage_whitespace # Require spaces around operators: `a + b`
  - overridden_super_call # Always call `super` in lifecycle overrides
  - prefer_self_type_over_type_of_self # Use `Self` over `type(of: self)`
  - redundant_nil_coalescing # Remove `?? nil` — it's a no-op
  - single_test_class # One test class/struct per test file
  - sorted_first_last # `.min()/.max()` over `.sorted().first/.last`
  - toggle_bool # `.toggle()` over `x = !x`
  - unneeded_parentheses_in_closure_argument # Remove parens around single closure param
  # unused_import is an analyzer-only rule, listed under analyzer_rules below
  - vertical_parameter_alignment_on_call # Align parameters in multi-line calls
  - yoda_condition # `value == constant`, not `constant == value`

# Thresholds — Warning = fix soon, Error = CI blocks merge
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 300 # Generous for SwiftUI views with many computed properties
  error: 400

file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10 # Push complex logic into helper functions
  error: 15

# Identifier naming — short names are OK for common SwiftUI patterns
identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id # SwiftUI Identifiable
    - vm # ViewModel shorthand
    - to # Common preposition parameter

# Force-pattern severity overrides — elevated to error so CI blocks any that slip through
force_unwrapping:
  severity: error

# Excluded paths — generated code, dependency caches, and tooling output
excluded:
  - Packages
  - DerivedData
  - fastlane
  - Pods
  - .build
  - "**/.build"

# Reporter format — integrates with Xcode build log; CI also parses it
reporter: "xcode"
