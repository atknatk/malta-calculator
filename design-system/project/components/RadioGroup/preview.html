<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.RadioGroup,
          { defaultValue: "single" },
          ["Single", "Married", "Parent"].map(function (l) {
            var v = l.toLowerCase();
            return h(
              "div",
              { key: v, className: "flex items-center gap-2" },
              h(M.RadioGroupItem, { value: v, id: v }),
              h(M.Label, { htmlFor: v }, l),
            );
          }),
        ),
      );
    </script>
  </body>
</html>
