<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      function Demo() {
        var a = useState(42000),
          b = useState(12.5);
        return h(
          "div",
          { className: "flex max-w-sm flex-col gap-3" },
          h(M.NumericInput, {
            value: a[0],
            onChange: a[1],
            min: 0,
            suffix: "€",
          }),
          h(M.NumericInput, {
            value: b[0],
            onChange: b[1],
            min: 0,
            suffix: "€/hr",
          }),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
    </script>
  </body>
</html>
