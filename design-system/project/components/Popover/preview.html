<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Popover,
          { defaultOpen: true },
          h(
            M.PopoverTrigger,
            { asChild: true },
            h(M.Button, { variant: "outline" }, "How is SSC worked out?"),
          ),
          h(
            M.PopoverContent,
            {
              align: "start",
              onOpenAutoFocus: function (e) {
                e.preventDefault();
              },
            },
            h(
              "div",
              { className: "space-y-2" },
              h("h4", { className: "font-medium leading-none" }, "Class 1 SSC"),
              h(
                "p",
                { className: "text-sm text-muted-foreground" },
                "10% of basic weekly wage, capped at €559.31 a week in 2026.",
              ),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
