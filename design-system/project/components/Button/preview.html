<!-- @dsCard group="Actions" height=120 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          "div",
          { className: "flex flex-col gap-3" },
          h(
            "div",
            { className: "flex flex-wrap items-center gap-3" },
            h(M.Button, null, "Calculate"),
            h(M.Button, { variant: "secondary" }, "Compare"),
            h(M.Button, { variant: "outline" }, "Reset"),
            h(M.Button, { variant: "ghost" }, "Cancel"),
            h(M.Button, { variant: "destructive" }, "Delete employee"),
            h(M.Button, { variant: "link" }, "View guide"),
          ),
          h(
            "div",
            { className: "flex flex-wrap items-center gap-3" },
            h(M.Button, { size: "sm" }, "Small"),
            h(M.Button, null, "Default"),
            h(M.Button, { size: "lg" }, "Large"),
            h(
              M.Button,
              { size: "icon", variant: "outline", "aria-label": "Calculator" },
              h(I.Calculator, { className: "h-4 w-4" }),
            ),
            h(M.Button, { disabled: true }, "Disabled"),
          ),
        ),
      );
    </script>
  </body>
</html>
