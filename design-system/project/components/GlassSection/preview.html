<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      function Demo() {
        var s = useState("full");
        return h(
          "div",
          { className: "max-w-md" },
          h(
            M.GlassSection,
            { icon: I.Briefcase, title: "Employment details" },
            h(M.PremiumToggleGroup, {
              options: ["full", "part"],
              labels: { full: "Full-time", part: "Part-time" },
              value: s[0],
              onChange: s[1],
              size: "sm",
            }),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
    </script>
  </body>
</html>
