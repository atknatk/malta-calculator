<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      function Demo() {
        var o = useState(true),
          s = useState("full"),
          b = useState("0");
        return h(
          "div",
          { className: "max-w-md" },
          h(
            M.AdvancedSettings,
            {
              isOpen: o[0],
              onToggle: function () {
                o[1](!o[0]);
              },
            },
            h(M.PremiumToggleGroup, {
              options: ["full", "part"],
              labels: { full: "Full-time", part: "Part-time" },
              value: s[0],
              onChange: s[1],
              size: "sm",
            }),
            h(M.PremiumInput, {
              label: "Fringe benefits",
              value: b[0],
              onChange: b[1],
              suffix: "€",
            }),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
    </script>
  </body>
</html>
