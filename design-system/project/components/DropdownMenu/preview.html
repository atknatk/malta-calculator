<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.DropdownMenu,
          { defaultOpen: true, modal: false },
          h(
            M.DropdownMenuTrigger,
            { asChild: true },
            h(M.Button, { variant: "outline" }, "Export"),
          ),
          h(
            M.DropdownMenuContent,
            {
              align: "start",
              onCloseAutoFocus: function (e) {
                e.preventDefault();
              },
            },
            h(M.DropdownMenuLabel, null, "Payslip"),
            h(M.DropdownMenuSeparator, null),
            h(
              M.DropdownMenuItem,
              null,
              "Download PDF",
              h(M.DropdownMenuShortcut, null, "⌘P"),
            ),
            h(M.DropdownMenuItem, null, "Export to Excel"),
            h(
              M.DropdownMenuCheckboxItem,
              { checked: true },
              "Include employer SSC",
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
