<!-- @dsCard height=288 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--background);
      }
      .cover {
        position: relative;
        width: 960px;
        height: 288px;
        overflow: hidden;
        background: var(--background);
      }
      .cover svg {
        position: absolute;
        inset: 0;
      }
      .gold {
        fill: var(--malta-gold);
      }
      .prim {
        fill: var(--primary);
      }
      .sec {
        fill: var(--secondary);
      }
      .ink {
        fill: var(--foreground);
      }
      .dot {
        fill: var(--background);
      }
      .r3 {
        rx: var(--radius-3xl);
      }
      .r2 {
        rx: var(--radius-2xl);
      }
      .rf {
        rx: var(--radius-full);
      }
      .words {
        position: absolute;
        left: 48px;
        bottom: 40px;
        max-width: 440px;
      }
      .name {
        margin: 0;
        font-family: var(--font-cal);
        font-weight: 600;
        font-size: 72px;
        line-height: 0.95;
        letter-spacing: -0.01em;
        color: var(--foreground);
      }
      .tag {
        margin: 8px 0 0;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
        <!--
      blocks: malta-gold 176×240 slab (radius-3xl) · primary 208×112 (radius-2xl) · secondary 112×112 disc (radius-full) · foreground 144×152 (radius-2xl)
      arrangement: one tall gold slab bleeding off the top, with satellites stepped on a space-4 grid; the ink block bleeds off the right and bottom
      pattern: dot grid at space-4 pitch cut from the gold slab, the site's own 16px dotted background (background.tsx) and its "precise, numbers-first" voice
      scales: gaps space-4 (16px); pitch space-4; radii radius-3xl, radius-2xl, radius-full
    -->
        <rect class="gold r3" x="512" y="-24" width="176" height="240" />
        <rect class="prim r2" x="704" y="32" width="208" height="112" />
        <rect class="sec rf" x="704" y="160" width="112" height="112" />
        <rect class="ink r2" x="832" y="160" width="144" height="152" />
        <g>
          <circle class="dot" cx="544" cy="136" r="2" />
          <circle class="dot" cx="560" cy="136" r="2" />
          <circle class="dot" cx="576" cy="136" r="2" />
          <circle class="dot" cx="592" cy="136" r="2" />
          <circle class="dot" cx="608" cy="136" r="2" />
          <circle class="dot" cx="624" cy="136" r="2" />
          <circle class="dot" cx="640" cy="136" r="2" />
          <circle class="dot" cx="656" cy="136" r="2" />
          <circle class="dot" cx="544" cy="152" r="2" />
          <circle class="dot" cx="560" cy="152" r="2" />
          <circle class="dot" cx="576" cy="152" r="2" />
          <circle class="dot" cx="592" cy="152" r="2" />
          <circle class="dot" cx="608" cy="152" r="2" />
          <circle class="dot" cx="624" cy="152" r="2" />
          <circle class="dot" cx="640" cy="152" r="2" />
          <circle class="dot" cx="656" cy="152" r="2" />
          <circle class="dot" cx="544" cy="168" r="2" />
          <circle class="dot" cx="560" cy="168" r="2" />
          <circle class="dot" cx="576" cy="168" r="2" />
          <circle class="dot" cx="592" cy="168" r="2" />
          <circle class="dot" cx="608" cy="168" r="2" />
          <circle class="dot" cx="624" cy="168" r="2" />
          <circle class="dot" cx="640" cy="168" r="2" />
          <circle class="dot" cx="656" cy="168" r="2" />
          <circle class="dot" cx="544" cy="184" r="2" />
          <circle class="dot" cx="560" cy="184" r="2" />
          <circle class="dot" cx="576" cy="184" r="2" />
          <circle class="dot" cx="592" cy="184" r="2" />
          <circle class="dot" cx="608" cy="184" r="2" />
          <circle class="dot" cx="624" cy="184" r="2" />
          <circle class="dot" cx="640" cy="184" r="2" />
          <circle class="dot" cx="656" cy="184" r="2" />
          <circle class="dot" cx="544" cy="200" r="2" />
          <circle class="dot" cx="560" cy="200" r="2" />
          <circle class="dot" cx="576" cy="200" r="2" />
          <circle class="dot" cx="592" cy="200" r="2" />
          <circle class="dot" cx="608" cy="200" r="2" />
          <circle class="dot" cx="624" cy="200" r="2" />
          <circle class="dot" cx="640" cy="200" r="2" />
          <circle class="dot" cx="656" cy="200" r="2" />
        </g>
      </svg>
      <div class="words">
        <h1 class="name">Malta<br />Calculator</h1>
        <p class="tag">
          Financial calculators for living and working in Malta.
        </p>
      </div>
    </div>
  </body>
</html>
