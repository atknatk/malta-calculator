<!-- @dsCard group="Overlays" height=340 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="root" class="p-4"></div>
    <script>
      var M = window.MaltaCalculator,
        I = M.Icons,
        h = React.createElement,
        useState = React.useState;
      ReactDOM.createRoot(document.getElementById("root")).render(
        h(
          M.Dialog,
          { defaultOpen: true, modal: false },
          h(
            M.DialogTrigger,
            { asChild: true },
            h(M.Button, { variant: "destructive" }, "Delete employee"),
          ),
          h(
            M.DialogContent,
            {
              onOpenAutoFocus: function (e) {
                e.preventDefault();
              },
              onInteractOutside: function (e) {
                e.preventDefault();
              },
            },
            h(
              M.DialogHeader,
              null,
              h(M.DialogTitle, null, "Delete Maria Borg?"),
              h(
                M.DialogDescription,
                null,
                "Her 14 payslips will be archived. This can't be undone.",
              ),
            ),
            h(
              M.DialogFooter,
              null,
              h(
                M.DialogClose,
                { asChild: true },
                h(M.Button, { variant: "outline" }, "Cancel"),
              ),
              h(M.Button, { variant: "destructive" }, "Delete"),
            ),
          ),
        ),
      );
    </script>
  </body>
</html>
